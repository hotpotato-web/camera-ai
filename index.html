<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cam</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0b0f; color: #f3f4f6; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
        
        h1 { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 4px; letter-spacing: 0.5px; }

        .modes { display: flex; background: #16161d; padding: 4px; border-radius: 12px; gap: 4px; border: 1px solid #262630; }
        .mode-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #9ca3af; font-size: 14px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .mode-btn.active { background: #6366f1; color: #fff; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .upload-label { background: #16161d; border: 2px dashed #262630; border-radius: 16px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .upload-label:active { border-color: #6366f1; }
        .upload-label span { font-size: 14px; color: #9ca3af; }
        input[type="file"] { display: none; }

        .action-btn { background: #6366f1; color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4); }
        .action-btn:active { opacity: 0.8; }
        .action-btn:disabled { background: #262630; color: #6b7280; box-shadow: none; cursor: not-allowed; }

        .result-box { width: 100%; border-radius: 16px; overflow: hidden; background: #16161d; display: none; border: 1px solid #262630; position: relative; }
        img { width: 100%; height: auto; display: block; }
        
        .loader { display: none; text-align: center; padding: 20px; color: #9ca3af; font-size: 14px; }
        .spinner { width: 24px; height: 24px; border: 3px solid #262630; border-top: 3px solid #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Camera</h1>

        <div class="modes">
            <button class="mode-btn active" onclick="setMode('moon', this)">🌕 Луна</button>
            <button class="mode-btn" onclick="setMode('object', this)">📦 Предметы</button>
        </div>

        <label class="upload-label" id="labelBox">
            <span id="labelText">📸 Сделать фото</span>
            <input type="file" accept="image/*" capture="environment" id="cameraInput" onchange="handleImage(this)">
        </label>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            Нейросеть обрабатывает фото...
        </div>

        <button class="action-btn" id="sendBtn" style="display: none;" onclick="sendToAI()">Запустить ИИ</button>

        <div class="result-box" id="resultBox">
            <img id="resultImg" alt="Результат">
        </div>
    </div>

    <script>
        let currentMode = 'moon';
        let selectedFile = null;
        
        // твой токен от fal.ai
        const FAL_KEY = "fal_sk_8ae675c272554e04b374032f38cc1be1:cb8a721d95a632ce5d8b0e876826e001";

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function handleImage(input) {
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                document.getElementById('labelText').innerText = "✅ Фото готово (нажмите, чтобы сменить)";
                document.getElementById('sendBtn').style.display = 'block';
            }
        }

        // Функция конвертации файла в base64 для отправки
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function sendToAI() {
            if (!selectedFile) return;

            document.getElementById('loader').style.display = 'block';
            document.getElementById('sendBtn').style.display = 'none';

            try {
                // 1. Переводим фото в base64
                const base64Image = await fileToBase64(selectedFile);

                // Выбираем модель в зависимости от режима:
                // Для предметов возьмем универсальный апскейлер/улучшайзер, для луны — можно настроить свой эндпоинт
                const modelId = currentMode === 'moon' 
                    ? "fal-ai/creative-upscaler" // модель для детализации и апскейла
                    : "fal-ai/bria/background-remove"; // например, удаление фона или обработка предметов

                // 2. Отправляем запрос на fal.ai API
                const response = await fetch(`https://fal.run/${modelId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Key ${FAL_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        image_url: base64Image,
                        prompt: currentMode === 'moon' ? "detailed moon craters, high resolution, 8k" : "high quality product shot"
                    })
                });

                const data = await response.json();
                
                document.getElementById('loader').style.display = 'none';

                // 3. Получаем результат от нейросети
                if (data.image && data.image.url) {
                    document.getElementById('resultImg').src = data.image.url;
                    document.getElementById('resultBox').style.display = 'block';
                } else {
                    alert('Ошибка обработки: ' + JSON.stringify(data));
                    document.getElementById('sendBtn').style.display = 'block';
                }

            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('sendBtn').style.display = 'block';
                alert('Ошибка соединения: ' + error.message);
            }
        }
    </script>
</body>
</html>
